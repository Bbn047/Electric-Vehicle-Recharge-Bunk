<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV-Bunk | login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Gruppo">
    <!----custom css file---->
    <link rel="stylesheet" href="./css/login.css">

</head>

<body>
    <div class="login-page">

        <div class="login-container">
            <!-- Background image -->
            <img src="./assets/images/login-img.png" alt="Login background">

            <!-- Overlay form -->
            <div class="login-card">

                <!-------brand section------>
                <div id="home" class="brand mt-3" >
                    <div class="brand-name"><i class='bx bx-petrol-pump me-2 fs-3' style="color:#0bec18;"></i>
                        <h5>EV-BUNK</h5>
                    </div>
                    <p>Charge Smarter. Drive Greener.</p>
                </div>


                <form class="mt-0" id="login-form">
                    <div class="form-group mb-3">
                        <input type="email" class="form-control" placeholder="Email" name="email">
                    </div>

                    <div class="form-group mb-2">
                        <input type="password" class="form-control" placeholder="Password" name="password">
                    </div>

                    <div class="form-options mb-1">
                        <div class="remember">
                            <input type="checkbox" id="remember">
                            <label for="remember"> Remember me</label>
                        </div>
                        <a href="#">Forgot password?</a>
                    </div>

                    <div class="login-btn mb-2">
                        <button class="btn btn-success w-100">Login</button>
                    </div>

                    <p class="signup-text gap-2">
                        Don’t have an account?
                        <a href="register.html">Sign up</a>
                    </p>
                </form>
            </div>
        </div>

    </div>

     <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/login.js"></script>
</body>

</html>
