<!DOCTYPE html>
<html>

<head>
  <title>User Dashboard </title>

<body>
  <!--navbar -->
  <nav class="navbar navbar-expand-lg sticky-top head-items">
    <div class="container-fluid me-3 ms-3">

      <!-- BRAND -->
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class='bx bx-petrol-pump me-2 fs-3' style="color:#0bec18;"></i>
        <span class="fs-3 brand-name ms-2">EV-BUNK</span>
      </a>

      <!-- TOGGLER -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- COLLAPSIBLE CONTENT -->
      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto d-flex align-items-center">

          <!-- Notification -->
          <li class="nav-item me-3">
            <a class="nav-link" href="#">
              <i class='bx bx-bell fs-4' style="color:#0bec18"></i>
            </a>
          </li>

          <!-- Welcome text -->
          <li class="nav-item d-flex align-items-center me-3">
            <span class="text-items">Welcome,</span>
            <span class="text-items fw-semibold ms-1" id="username"></span>
          </li>

          <!-- Profile dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle p-0" href="#" data-bs-toggle="dropdown" role="button"
              aria-expanded="false">
              <img src="https://github.com/mdo.png" width="32" height="32" class="rounded-circle">
            </a>
            <ul class="dropdown-menu dropdown-menu-end custom-menu">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">Settings</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </li>

        </ul>
      </div>

    </div>
  </nav>

    <div class="main-container">
      <!----heading section----->
      <div class="welcome-note">
        <h3 class="heading">Welcome to your Dashboard</h3>
        <p>Book your EV charging slots conviniently</p>
      </div>

    </div>
  </section>

  <!--------page section ------>
  <section class="body-section">

    <div class="page-wrapper">
      <div class="container-fluid custom-grid">

        <!----charging and booking section----->
        <div class="col one charging-booking">
          <div class="booking-box">
            <div class="booking-status">
              <div class="booking-title">
                <span><i class='bx  bx-book-library' style='color:#0bec18'></i></span>
                <h5 class="booking-heading"> My Booking</h5>
              </div>
              <div class="booking-data ms-3 mt-3">
                <!--booking data-->
              </div>
            </div>
            <div class="charging-status">
              <div class="charging-title">
                <span><i class='bx  bx-bolt-circle' style='color:#f9f512'></i> </span>
                <h5 class="charging-heading">Charging Status</h5>
              </div>
              <div class="charging-data ms-3 mt-3">
                <!--charging data-->
              </div>

            </div>
          </div>
        </div>

        <!---Bunk list---->
        <div class="col two bunk-list">

          <!---search bunk location ------>
          <div class="search">
            <h>Find Charging Station</h>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>

          <!-----map loction ----->
          <!-- Map & Nearby Stations -->
          <div class="map-wrapper">

            <!-- Google Map -->
            <div id="map"></div>

            <!-- Nearby Stations -->
            <div class="near-stations">
              <h6 class="mb-3">Nearby Charging Stations</h6>
              <!--station data-->

            </div>
          </div>

        </div>

        <!----history section---->
        <div class="col three history">
          <div class="history-box">

            <!----header section ------>
            <div class="head-section">
              <span><i class='bx  bx-history' style='color:#2efa11'></i> </span>
              <h5>Booking History</h5>
            </div>

            <div class="history-data">
                <!----history items------->
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>

  </section>
