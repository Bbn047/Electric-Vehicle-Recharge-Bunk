<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
  <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Gruppo">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/admin.css">
</head>

<body>
  <div class="main-container">
    <div class="navbar-content">
      <section class="nav-section">
        <!-- BRAND -->
        <div class="brand"><a class="navbar-brand d-flex align-items-center" href="#">
            <i class='bx bx-petrol-pump ms-3 me-2 fs-3' style="color:#0bec18;"></i>
            <span class="fs-3 brand-name ms-2">EV-BUNK</span>
          </a>
        </div>
        <!------navbar section------------>
        <nav class="custom-nav">
          <div class="container-fluid ">

            <div class="nav-items" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <span><i class='bx  me-2 bx-home-alt-2' style='color:#2efa11'></i></span> <a class="nav-link active"
                    aria-current="page" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                  <span><i class='bx  bx-ev-station me-2' style='color:#2efa11'></i> </span><a class="nav-link"
                    href="#">Stations</a>
                </li>
                <li class="nav-item">
                  <span><i class='bx  bx-calendar-week me-2' style='color:#2efa11'></i> </span><a class="nav-link"
                    href="#">Bookings</a>
                </li>
                <li class="nav-item">
                  <span><i class='bx  bx-user me-2' style='color:#2efa11'></i> </span><a class="nav-link"
                    href="#">Users</a>
                </li>
              </ul>
            </div>
          </div>

          <div class="admin-section">
            <img class="admin-image" src="./assets/images/man.png" alt="user_image">

            <div class="admin-details">
              <h5 class="admin-name">Admin Name</h5>
              <p class="admin-tag">Administrator</p>
            </div>
          </div>

        </nav>
      </section>
    </div>

    <!-----right side main section --------->
    <div class="main-content">
      <!--------------header section ------------>
      <section class="main-section pt-2">
        <header class="container header-section">
          <div class="welcome-data">
            <h5>Welcome ,Admin!</h5>
            <p>manage EV Charging Stations Efficiently.</p>
          </div>
          <div class="profile">
            <span><i class='bxf  bx-bell' style='color:#2efa11'></i> </span>
            <div class="dropdown">
              <a href="#" class="dropdwon-toggle">
                <img class="admin-img" src="./assets/images/man.png" alt="profile-img"><i class='bxf fs-3 bx-caret-down'
                  style='color:#2efa11'></i>
              </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                  <li><a class="dropdown-item" href="#">Action</a></li>
                  <li><a class="dropdown-item" href="#">Another action</a></li>
                  <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
              </li>
            </div>
          </div>
        </header>
      </section>
    </div>
  </div>

</body>

</html>
