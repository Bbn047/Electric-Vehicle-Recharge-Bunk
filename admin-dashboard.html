<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
  <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Gruppo">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/admin.css">
</head>

<body>
  <div class="main-container">

    <!----left section----->
    <div class="left-section">

      <header class="header">
        <!----comapany name-->
        <div class="brand">
          <a class="navbar-brand d-flex align-items-center" href="#">
            <i class='bx bx-petrol-pump ms-3 fs-3' style="color:#0bec18;"></i>
            <span class="fs-3 brand-name ms-2">EV-BUNK</span>
          </a>
          <!---side bar close button-->
          <i id="close-icon" class='bx  bx-x-circle bx-close' style='color:black'></i> 
        </div>

        <!--left nav items---->
        <nav class="navbar">
          <ul class="navbar-nav sidebar">
            <li class="nav-item">
              <span><i class='bx  me-2 bx-home-alt-2' style='color:#2efa11'></i></span> <a class="nav-link active"
                aria-current="page" href="#">Dashboard</a>
            </li>
            <li class="nav-item">
              <span><i class='bx  bx-ev-station me-2' style='color:#2efa11'></i> </span><a class="nav-link"
                href="#">Stations</a>
            </li>
            <li class="nav-item">
              <span><i class='bx  bx-calendar-week me-2' style='color:#2efa11'></i> </span><a class="nav-link"
                href="#">Bookings</a>
            </li>
            <li class="nav-item">
              <span><i class='bx  bx-user me-2' style='color:#2efa11'></i> </span><a class="nav-link" href="#">Users</a>
            </li>
            <li class="nav-item">
              <span><i class='bx  bx-cog me-2' style='color:#2efa11'></i> </span><a class="nav-link"
                href="#">Settings</a>
            </li>
          </ul>
        </nav>
      </header>

    </div>

    <!------right section------>
    <div class="right-section ms-2 pt-2">
      <!---side bar menu button-->
      <i id="menu-icon" class='bx bx-menu fs-3'></i>
      <div class="welcome-note">
        <p>hello user</p>
      </div>

    </div>
  </div>




  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="./js/admin.js"></script>
</body>

</html>
