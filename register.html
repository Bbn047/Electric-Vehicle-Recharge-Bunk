<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV-Bunk | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Gruppo">
    <!----custom css file---->
    <link rel="stylesheet" href="./css/register.css">

</head>

<body>
    <div class="register-page">

        <div class="register-container">
            <!-- Background image -->
            <img src="./assets/images/login-img.png" alt="Login background">

            <!-- Overlay form -->
            <div class="register-card ">

                <!-------brand section------>
                <div class="brand mt-2">
                    <div class="brand-name mt-2"><i class='bx bx-petrol-pump me-2 fs-3' style="color:#0bec18;"></i>
                        <h5>EV-BUNK</h5>
                    </div>
                    <p>Create your account</p>

                </div>


                <form class="mt-0">
                    <div class=" form-group d-flex mt-0 custom-input">
                        <div class="col-6 me-2">
                            <input type="text" class="form-control" placeholder="First name">
                        </div>
                        <div class="col-6">
                            <input type="text" class="form-control" placeholder="Last name">
                        </div>
                    </div>

                    <div class="mt-2">
                        <input type="email" class="form-control" placeholder="Email">
                    </div>

                    <div class="mt-2">
                        <input type="password" class="form-control" placeholder="Password">
                    </div>

                    <div class="mt-2">
                        <input type="password" class="form-control" placeholder="Confirm password">
                    </div>

                    <div class="register-btn mt-2 mb-2">
                        <button class="btn btn-success w-100">Sign Up</button>
                    </div>

                    <p class="signup-text gap-2">
                        Already have an account?
                        <a href="#">Login</a>
                    </p>
                </form>
            </div>
        </div>

    </div>
</body>

</html>
