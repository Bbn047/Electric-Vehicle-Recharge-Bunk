<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV-Bunk | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Gruppo">
    <!----custom css file---->
    <link rel="stylesheet" href="./css/register.css">

</head>

<body>
    <div class="register-page">

        <div class="register-container">
            <!-- Background image -->
            <img src="./assets/images/login-img.png" alt="Login background">

            <!-- Overlay form -->
            <div class="register-card ">

                <!-------brand section------>
                <div id="home" class="brand mt-2">
                    <div class="brand-name mt-2"><i class='bx bx-petrol-pump me-2 fs-3' style="color:#0bec18;"></i>
                        <h5>EV-BUNK</h5>
                    </div>
                    <p>Create your account</p>

                </div>


                <form class="mt-0" id="register">
                    <div class=" form-group mt-0 custom-input">
                        <div class="col-5.5">
                            <input type="text" class="form-control" placeholder="First name" name="fname">
                        </div>
                        <div class="col-5.5">
                            <input type="text" class="form-control" placeholder="Last name" name="lname">
                        </div>
                    </div>

                    <div class="mt-2">
                        <input type="email" class="form-control" placeholder="Email" name="mail">
                    </div>

                    <div class="mt-2">
                        <input type="password" class="form-control" placeholder="Password" name="pswd">
                    </div>

                    <div class="mt-2">
                        <input type="password" class="form-control" placeholder="Confirm password" name="pswd2">
                    </div>

                    <!---------------user/admin selection------------>
                    <div class="mt-2">
                        <select class="form-control role-selection" name="role" required>
                            <option value="">Select Role</option>
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="register-btn mt-2 mb-2">
                        <button class="btn btn-success w-100">Sign Up</button>
                    </div>

                    <p class="signup-text gap-2">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </form>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="./js/register.js"></script>

</body>

</html>
